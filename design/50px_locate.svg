<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <title>Radar (50px, 1-bit black and white)</title>
  <!-- Palette used: 000000 FFFFFF only -->

  <!-- Dish outline -->
  <circle cx="25" cy="25" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- Inner range ring -->
  <circle cx="25" cy="25" r="12" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Sweep wedge (solid, so it survives 1-bit conversion) -->
  <path d="M25 25 L25 4 A21 21 0 0 1 43.19 14.5 Z" fill="#000000"/>

  <!-- Contact lit by the sweep (white knock-out), contact outside it (black) -->
  <circle cx="34" cy="13" r="3" fill="#FFFFFF"/>
  <circle cx="11" cy="36" r="3" fill="#000000"/>

  <!-- Centre -->
  <circle cx="25" cy="25" r="3" fill="#000000"/>
</svg>
